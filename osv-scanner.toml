# Alertes OSV examinées et sans correctif disponible (lues par OSV-Scanner et par
# OpenSSF Scorecard pour Cargo.lock). Mêmes décisions que dans deny.toml.
#
# Aucune n'est une faille exploitable : ce sont des crates « non maintenues » ou
# « unsound » arrivées par des dépendances (Tauri, nih-plug, egui), dont la plupart ne
# sont même pas compilées sous Windows. Chaque exception expire au bout de six mois :
# elle redevient alors une alerte, à réexaminer (`cargo audit`, `cargo tree -i <crate>`).

[[IgnoredVulns]]
id = "RUSTSEC-2021-0145"
effectiveUntil = 2027-05-17
reason = "atty (via nih_log de nih-plug) : lecture non alignée dans la détection d'un terminal MSYS sous Windows, appelée une fois à l'initialisation du journal du plugin ; sans effet sur x86-64, qui permet les lectures non alignées. Pas de version corrigée."

