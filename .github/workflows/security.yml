# Analyses de sécurité : failles connues des dépendances (RustSec, npm), licences et
# provenance des crates (cargo-deny), analyse statique du code (CodeQL).
# À chaque push sur main, à chaque pull request et chaque lundi (nouvelles failles).
# Pas pour un commit qui ne touche que la doc ; l'analyse du lundi tourne toujours.
name: Sécurité

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSES/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSES/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Un commit plus récent sur la même branche annule l'analyse devenue obsolète.
concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dépendances (cargo-deny, cargo-audit, pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories bans licenses sources
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pnpm audit
        run: pnpm --dir ui audit --prod

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
