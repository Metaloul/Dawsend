# Analyses de sécurité : failles connues des dépendances (RustSec, npm), licences et
# provenance des crates (cargo-deny), analyse statique du code (CodeQL).
# À chaque push sur main, à chaque pull request et chaque lundi (nouvelles failles).
# Pas pour un commit qui ne touche que la doc ; l'analyse du lundi tourne toujours.
name: Sécurité

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSES/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSES/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Un commit plus récent sur la même branche annule l'analyse devenue obsolète.
concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dépendances (cargo-deny, cargo-audit, pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm audit
        run: pnpm --dir ui audit --prod

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
