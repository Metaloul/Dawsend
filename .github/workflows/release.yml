# Publie une version : installateur Windows signé pour les mises à jour, version
# portable (zip), latest.json (lu par l'appli), sommes SHA-256 et notes tirées de
# CHANGELOG.md.
#
# Lancement : pousser un tag « vX.Y.Z » égal à la version de Cargo.toml, ou lancer le
# workflow à la main depuis l'onglet Actions.
#
# Release à blanc : lancement à la main avec « publier » décoché. Tout est construit,
# signé et envoyé à VirusTotal (verdict dans le résumé du run), mais rien n'est publié.
#
# Secrets du dépôt :
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (obligatoires)
#   VT_API_KEY  (facultatif : analyse VirusTotal des fichiers publiés)
#
# Le job « provenance » ajoute Dawsend-X.Y.Z.intoto.jsonl : attestation SLSA niveau 3,
# signée par Sigstore, qui relie chaque fichier publié à ce workflow et à ce commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publier:
        description: Publier la release (décoché = à blanc, pour vérifier le build et VirusTotal)
        type: boolean
        default: true

# Droits minimaux par défaut ; chaque job demande ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # création de la release
      actions: read # lecture du résultat de la CI de ce commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $v de Cargo.toml"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Lit le cache de main. N'en enregistre pas : un cache créé sur un tag n'est
      # lisible par aucun autre tag, il ne servirait jamais.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      # L'appli Tauri intègre ui/dist à la compilation : l'interface d'abord.
      - name: Interface
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      # La CI a déjà testé ce commit : pas besoin de tout recompiler en debug. Sinon
      # (CI pas finie, ou commit de doc qu'elle a sauté), on teste ici.
      - name: CI de ce commit
        id: ci
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&status=success" --jq '.total_count'
          if ([int]$n -gt 0) { "La CI a validé $env:GITHUB_SHA : tests sautés." } else { "Pas de CI réussie pour $env:GITHUB_SHA : tests lancés ici." }
          "passed=$([int]$n -gt 0)".ToLower() >> $env:GITHUB_OUTPUT

      - name: Tests
        if: steps.ci.outputs.passed != 'true'
        run: cargo test --workspace --locked

      - name: Installateur
        shell: pwsh
        run: ./installer/build.ps1

      - name: Signature pour les mises à jour
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $exe = Resolve-Path "target/installer/Dawsend-Setup-$v.exe"
          pnpm --dir ui tauri signer sign --app-version $v "$exe"
          node scripts/latest-json.mjs $v "target/installer/Dawsend-Setup-$v.exe" "target/installer/Dawsend-Setup-$v.exe.sig" "$env:GITHUB_REPOSITORY"

      - name: Sommes SHA-256
        shell: pwsh
        run: |
          Get-ChildItem target/installer/Dawsend-Setup-*.exe, target/installer/Dawsend-*-portable.zip, target/installer/latest.json |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii target/installer/SHA256SUMS.txt
          Get-Content target/installer/SHA256SUMS.txt

      # Sujets de la provenance : le contenu de SHA256SUMS.txt (fins de ligne Unix), en
      # base64, comme l'attend le générateur SLSA.
      - name: Empreintes pour la provenance
        id: hashes
        shell: pwsh
        run: |
          $txt = ((Get-Content target/installer/SHA256SUMS.txt) -join "`n") + "`n"
          "hashes=" + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($txt)) >> $env:GITHUB_OUTPUT

      - name: Release GitHub
        if: github.event_name == 'push' || inputs.publier
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "v$v" `
            "target/installer/Dawsend-Setup-$v.exe" `
            "target/installer/Dawsend-Setup-$v.exe.sig" `
            "target/installer/Dawsend-$v-portable.zip" `
            target/installer/latest.json `
            target/installer/SHA256SUMS.txt `
            --title "Dawsend $v" --notes-file target/installer/release-notes.md

      - name: VirusTotal
        id: virustotal
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            target/installer/Dawsend-Setup-*.exe
            target/installer/Dawsend-*-portable.zip

      # Attend la fin de chaque analyse (API v3 : GET /analyses/<id>) et écrit le
      # verdict dans le journal et le résumé du run. Ne fait jamais échouer le job :
      # en release normale, les fichiers sont déjà publiés.
      - name: Verdict VirusTotal
        if: steps.virustotal.outputs.analysis != ''
        shell: pwsh
        env:
          ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          $deadline = (Get-Date).AddMinutes(20)
          $lines = @("### Verdict VirusTotal", "", "| Fichier | Malveillant | Suspect | Sans détection | Rapport |", "| --- | --- | --- | --- | --- |")
          foreach ($pair in $env:ANALYSIS -split ',') {
            $name, $url = $pair -split '=', 2
            $name = Split-Path -Leaf $name
            $id = $url -replace '^.*/file-analysis/([^/]+)/.*$', '$1'
            do {
              Start-Sleep -Seconds 30
              try {
                $a = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$id" -Headers @{ 'x-apikey' = $env:VT_API_KEY }
                $status = $a.data.attributes.status
              } catch {
                $status = "erreur : $($_.Exception.Message)"
              }
              "$name : $status"
            } while ($status -ne 'completed' -and (Get-Date) -lt $deadline)
            if ($status -ne 'completed') {
              "::warning::VirusTotal n'a pas fini d'analyser $name en 20 minutes"
              $lines += "| $name | ? | ? | ? | [analyse en cours]($url) |"
              continue
            }
            $s = $a.data.attributes.stats
            $lines += "| $name | $($s.malicious) | $($s.suspicious) | $($s.undetected + $s.harmless) | [rapport]($url) |"
            $a.data.attributes.results.PSObject.Properties |
              Where-Object { $_.Value.category -in 'malicious', 'suspicious' } |
              ForEach-Object {
                $msg = "$name : $($_.Name) ($($_.Value.category)) : $($_.Value.result)"
                "::warning::$msg"
                $lines += "- $msg"
              }
          }
          $out = $lines -join "`n"
          $out
          $out >> $env:GITHUB_STEP_SUMMARY

      # Ajoute le lien du rapport VirusTotal aux notes de la release (sortie
      # « fichier=adresse » de l'action, séparée par des virgules).
      - name: Rapport VirusTotal dans les notes
        if: steps.virustotal.outputs.analysis != '' && (github.event_name == 'push' || inputs.publier)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $links = $env:ANALYSIS -split ',' | ForEach-Object {
            $name, $url = $_ -split '=', 2
            "- [$(Split-Path -Leaf $name)]($url)"
          }
          $body = (Get-Content target/installer/release-notes.md -Raw) + "`n### Analyse antivirus`n`n" + ($links -join "`n") + "`n"
          Set-Content -Path target/installer/release-notes.md -Value $body -Encoding utf8
          gh release edit "v$v" --notes-file target/installer/release-notes.md

  # Provenance SLSA, jointe à la release. Le générateur se référence par tag (et non
  # par SHA) : c'est ce que vérifient slsa-verifier et Scorecard.
  provenance:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read # détection de l'environnement GitHub Actions
      id-token: write # signature Sigstore
      contents: write # ajout du fichier à la release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.windows.outputs.hashes }}
      upload-assets: true
      provenance-name: Dawsend-${{ needs.windows.outputs.version }}.intoto.jsonl
